<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MindMapAny</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="account" hidden class="account">
      <div class="account-main">
        <span id="accountName" class="account-name"></span>
        <span id="accountPlan" class="account-plan"></span>
      </div>
      <span id="accountCredits" class="account-credits"></span>
    </div>
    <button id="signIn" hidden class="signin" type="button">登录后可在当前页面直接生成 →</button>
    <main class="shell">
      <header class="brand-row">
        <div class="brand">
          <img src="icon.svg" alt="" />
          <div>
            <strong>MindMapAny</strong>
            <span>把正在看的内容变清楚</span>
          </div>
        </div>
        <span class="privacy-pill">点击后读取</span>
      </header>

      <section class="source-card" aria-live="polite">
        <div class="source-icon" id="sourceIcon">↗</div>
        <div class="source-copy">
          <p class="eyebrow" id="sourceType">正在识别页面</p>
          <h1 id="pageTitle">请稍候…</h1>
          <p id="pageMeta">—</p>
        </div>
      </section>

      <div class="mode-switch" role="radiogroup" aria-label="整理范围">
        <button type="button" class="active" data-mode="page" role="radio" aria-checked="true">
          <span>当前页面</span>
          <small id="pageCount">—</small>
        </button>
        <button type="button" data-mode="selection" role="radio" aria-checked="false" disabled>
          <span>选中文本</span>
          <small id="selectionCount">未选择</small>
        </button>
      </div>

      <section class="options" aria-label="生成设置">
        <label>
          <span>输出语言</span>
          <select id="language">
            <option value="auto">跟随原文</option>
            <option value="zh-CN">简体中文</option>
            <option value="zh-TW">繁體中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
          </select>
        </label>
        <label>
          <span>内容深度</span>
          <select id="depth">
            <option value="concise">精简</option>
            <option value="standard" selected>标准</option>
            <option value="detailed">详细</option>
          </select>
        </label>
        <label>
          <span>整理方式</span>
          <select id="purpose">
            <option value="general">通用</option>
            <option value="study">学习</option>
            <option value="structure">结构</option>
            <option value="meeting">会议</option>
          </select>
        </label>
      </section>

      <p class="error" id="error" role="alert" hidden></p>
      <button type="button" class="generate" id="generate" disabled>
        <span>总结为思维导图</span>
        <span aria-hidden="true">→</span>
      </button>
      <p class="fine-print">将在工作台中生成，并按现有套餐扣除积分</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
